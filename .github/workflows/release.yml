name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: seeed_xiao_esp32c3
            board_label: seeed_xiao_esp32c3
          - env: esp32_wroom_32
            board_label: esp32_wroom_32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Prepare release assets
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          if [ "${VERSION}" = "" ] || [ "${VERSION}" = "main" ]; then
            VERSION="manual"
          fi

          cp .pio/build/${{ matrix.env }}/firmware.bin dist/perry-talkbox-${VERSION}-${{ matrix.board_label }}-firmware.bin
          cp .pio/build/${{ matrix.env }}/bootloader.bin dist/perry-talkbox-${VERSION}-${{ matrix.board_label }}-bootloader.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin dist/perry-talkbox-${VERSION}-${{ matrix.board_label }}-partitions.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board_label }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p out
          find release-assets -type f -name "*.bin" -exec cp {} out/ \;

      - name: Generate checksums
        run: |
          cd out
          sha256sum *.bin > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: perry-talkbox-firmware ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.bin
            out/SHA256SUMS.txt
